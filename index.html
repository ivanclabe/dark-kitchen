<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quanela — Tu cocina, más inteligente</title>
    <meta
      name="description"
      content="Pedidos, cocina, despacho, menús, inventario y cobros en una sola plataforma para dark kitchens. Empieza gratis 14 días, sin tarjeta."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- The page color before the app paints: no white flash on the dark theme while it loads. -->
    <style>
      html { background: #0a0a0a; }
      html[data-theme='light'] { background: #f5f5f5; }
      html[data-theme='neutral'] { background: #f2f0ed; }
    </style>
    <!-- Apariencia de este equipo (ADR 0023), antes del primer pintado: sin destello al cargar. -->
    <script>
      try {
        // Cookie of the parent domain first (shared by every organization subdomain), then this origin.
        var c = document.cookie.split('; ').filter(function (x) { return x.indexOf('dk-appearance=') === 0 })[0]
        var a = JSON.parse((c && decodeURIComponent(c.slice(14))) || localStorage.getItem('dk-appearance') || '{}')
        // ADR 0061: dark, light or neutral; «system» follows the OS (light or dark). Without a chosen theme, light
        // everywhere (ADR 0072, same as defaultThemeFor).
        var chosen = a.theme === 'dark' || a.theme === 'light' || a.theme === 'neutral' || a.theme === 'system'
        var byPage = 'light'
        var t = !chosen ? byPage : a.theme === 'light' || a.theme === 'neutral' ? a.theme : a.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        // The browser bar (mobile) in the page color of the theme.
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f5f5f5' : t === 'neutral' ? '#f2f0ed' : '#0a0a0a')
        document.documentElement.dataset.textSize = a.textSize === 'large' ? 'large' : 'normal'
      } catch (e) {}
    </script>
    <!-- Marca (paquete quanela-assets): favicon, ícono de la app y manifiesto para instalarla. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/quanela-app-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Al compartir un enlace (ADR 0011): __SITE_URL__ lo completa vite.config.ts con VITE_SITE_URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="quanela" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="quanela — Tu cocina, más inteligente" />
    <meta property="og:description" content="Pedidos, cocina, despacho, menús, inventario y cobros en una sola plataforma. Planes desde $49.900 COP/mes, con 14 días gratis." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="quanela: tu cocina, más inteligente" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="quanela — Tu cocina, más inteligente" />
    <meta name="twitter:description" content="Pedidos, cocina, despacho, menús, inventario y cobros en una sola plataforma para dark kitchens." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
